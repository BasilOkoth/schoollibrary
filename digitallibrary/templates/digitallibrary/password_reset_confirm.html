{% extends "digitallibrary/base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-6 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4">Create a new password</h1>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded"
            >
                Change password
            </button>
        </form>
    {% else %}
        <p>
            This password-reset link is invalid or has expired.
            Please request another link.
        </p>
    {% endif %}
</div>
{% endblock %}
