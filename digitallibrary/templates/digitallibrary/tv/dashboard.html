{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="refresh" content="{{ tv_settings.refresh_interval|default:30 }}">
    <title>{{ school_name }} - School TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .tv-container {
            height: 100vh;
            width: 100vw;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        
        .content-card {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .marquee {
            animation: marquee 20s linear infinite;
        }
        
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        /* Hide scrollbar but keep functionality */
        .tv-container::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
        
        @media (min-width: 768px) {
            .grid-layout-split {
                display: grid;
                grid-template-columns: 1fr 300px;
                gap: 1rem;
            }
        }
        
        .clock {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
        }
        
        .emergency-alert {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { background-color: rgba(239, 68, 68, 0.8); }
            50% { background-color: rgba(239, 68, 68, 1); }
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <!-- Header with School Name and Clock -->
        <div class="bg-black/50 backdrop-blur-md border-b border-white/10 sticky top-0 z-10">
            <div class="px-8 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-white">{{ school_name }}</h1>
                    <p class="text-purple-300 text-sm">School Information TV</p>
                </div>
                <div class="text-right">
                    <div class="clock text-white" id="clock"></div>
                    <div class="text-purple-300 text-sm" id="date"></div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="p-6">
            {% if tv_settings.layout == 'split' %}
            <!-- Split Layout: Main content + Sidebar -->
            <div class="grid-layout-split">
                <div class="space-y-4">
                    {% for content in active_content|slice:":3" %}
                        {% include "digitallibrary/tv/_content_card.html" with content=content %}
                    {% endfor %}
                </div>
                <div class="space-y-4">
                    <div class="bg-white/10 backdrop-blur rounded-lg p-4">

                        <div class
