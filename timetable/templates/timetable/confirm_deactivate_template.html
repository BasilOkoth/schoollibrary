{% extends "digitallibrary/base.html" %}

{% block content %}
<div class="max-w-xl mx-auto space-y-5">

    <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-5">
        <h1 class="text-2xl font-extrabold text-yellow-300">
            Deactivate Timetable?
        </h1>

        <p class="text-sm text-gray-300 mt-3">
            This will stop the timetable from appearing in ShuleHub and on TV, but it will not permanently delete the records.
        </p>

        <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 mt-4 text-sm text-gray-300">
            <p><strong>Timetable:</strong> {{ template.name }}</p>
        </div>
    </div>

    <form method="post" class="flex gap-2">
        {% csrf_token %}

        <button type="submit"
                class="bg-yellow-600 hover:bg-yellow-700 text-white px-5 py-2 rounded-lg text-sm font-bold">
            Yes, Deactivate
        </button>

        <a href="{{ safe_app_prefix }}/timetable/manage/"
           class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-2 rounded-lg text-sm font-bold">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
